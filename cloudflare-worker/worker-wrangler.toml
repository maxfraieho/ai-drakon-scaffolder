name = "drakon-antigravity-worker"
main = "worker-mcp-drakon.js"
compatibility_date = "2024-01-01"
account_id = "c354ea45a11a1e1c14f1f41fe780cb34"

[vars]
DRAKON_CODEGEN_FUNCTION_ID = "6a33b6050037a2fff34e"
# MCP_API_KEY removed 2026-08-23: was committed here in plaintext
# (D17/N-finding). Rotated live via `wrangler secret put MCP_API_KEY`;
# now a secret, never checked into source. See
# docs/reports/2026-08-23-openbot-verifier-final-synthesis.md.

[[d1_databases]]
binding = "D1_DB"
database_name = "ai-drakon-saas"
database_id = "743d5bb0-d09d-4dcc-8329-8ebae8d533f4"

[[services]]
binding = "DOCS_AGENT"
service = "docs-agent-flue"

[[services]]
binding = "ARCHITECT_AGENT"
service = "architect-agent-flue"

[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "DIAGRAM_SYNC"
class_name = "DiagramSyncDO"

# `migrations` and `exports` are mutually exclusive, AND the live Cloudflare
# API rejects reverting a Worker from `exports` back to `migrations` once
# it's been deployed via `exports` (confirmed 2026-08-23: deploy attempt
# with a [[migrations]] block failed with API code 100403, "This Worker
# was last deployed using the declarative `exports` flow; reverting to
# `migrations` is not supported. Please continue to use `exports`." --
# live state was unaffected, deploy is atomic, nothing broke). So both DO
# classes must be declared under `exports`, not `migrations`, from here on.
[exports.RoomDO]
type = "durable-object"
storage = "sqlite"

# DiagramSyncDO has never been bound/migrated before -- this is its first
# declaration. Under the `exports` model this is the same declarative
# syntax as an already-existing export; wrangler/Cloudflare provisions it
# on first deploy rather than requiring a separate "new class" migration
# step the way the legacy `migrations` flow did.
[exports.DiagramSyncDO]
type = "durable-object"
storage = "sqlite"



