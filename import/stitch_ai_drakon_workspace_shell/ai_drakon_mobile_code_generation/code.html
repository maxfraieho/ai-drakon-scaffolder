<body class="font-body-md text-on-surface antialiased h-screen w-screen flex flex-col justify-end overflow-hidden relative">

<div class="w-full h-[16px] flex justify-center items-center py-xs cursor-pointer">

</div>
<!-- Header -->
<div class="flex justify-between items-center px-lg pb-md border-b border-outline-variant/30">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">terminal</span>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface">ГЕНЕРУВАТИ КОД</span>

</div>
</div>
<button class="p-xs text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high rounded transition-colors">

</button>
</div>

<div class="flex-1 overflow-y-auto p-lg flex flex-col gap-lg">

<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant">МОВА</label>
<div class="flex p-xs bg-surface-container-lowest rounded border border-outline-variant/30 w-full">
<button class="flex-1 py-sm font-code-sm text-code-sm text-surface-container bg-primary-container rounded shadow-sm text-center">Python</button>
<button class="flex-1 py-sm font-code-sm text-code-sm text-on-surface-variant hover:text-on-surface transition-colors text-center">TS</button>
<button class="flex-1 py-sm font-code-sm text-code-sm text-on-surface-variant hover:text-on-surface transition-colors text-center">JS</button>
</div>
</div>
<!-- Description Input -->
<div class="flex flex-col gap-xs flex-1">
<label class="font-label-caps text-label-caps text-on-surface-variant">ОПИС ПОВЕДІНКИ</label>
<textarea class="w-full flex-1 bg-[#191c23] border border-white/10 rounded p-sm font-code-md text-code-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-0 resize-none transition-colors placeholder-on-surface-variant/50" placeholder="Опишіть логіку функції або компонента..."></textarea>
</div>

<div class="flex items-center justify-between py-sm border-t border-outline-variant/10">

<span class="material-symbols-outlined text-on-surface-variant text-[18px]">expand_more</span>
</div>
</div>

<span class="font-body-sm text-body-sm">10–30 секунд</span>
</div>
<button class="flex items-center gap-xs bg-primary-container text-black px-lg py-sm rounded font-body-md text-body-md font-semibold hover:bg-primary-fixed transition-colors">
