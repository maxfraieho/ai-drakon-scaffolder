name: Mirror to ai-drakon-setup

on:
  push:
    branches: [main]

jobs:
  mirror:
    if: github.repository != 'maxfraieho/ai-drakon-setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push mirror to ai-drakon-setup
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/maxfraieho/ai-drakon-setup.git"
          git push mirror main --force
