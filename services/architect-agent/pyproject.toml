[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "architect-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "radon>=6.0.1",
    "networkx>=3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
