name = "drakon-agent-flue"
main = "dist/index.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "FLUE_REGISTRY", class_name = "FlueRegistry" },
  { name = "FLUE_DRAKON_AGENT", class_name = "FlueDrakonAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlueRegistry", "FlueDrakonAgent"]

[[kv_namespaces]]
binding = "KNOWLEDGE_BASE"
id = "drakon_kb"
preview_id = "drakon_kb_preview"
